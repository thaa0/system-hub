<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Cliente</title>
</head>
<body>
  <form action="@{/clientes/cadastrar}" method="post" th:object="${cliente}">
    <label for="name">Nome:</label>
    <input type="text" id="name" th:field="*{name}" />

    <label for="celular">Celular:</label>
    <input type="text" id="celular" th:field="*{celular}" />

    <label for="cpf_cnpj">CPF/CNPJ:</label>
    <input type="text" id="cpf_cnpj" th:field="*{cpf_cnpj}" />

    <h3>Endereço</h3>
    <label for="rua">Rua:</label>
    <input type="text" id="rua" th:field="*{endereco.rua}" />

    <label for="numero">Número:</label>
    <input type="text" id="numero" th:field="*{endereco.numero}" />

    <label for="bairro">Bairro:</label>
    <input type="text" id="bairro" th:field="*{endereco.bairro}" />

    <label for="cidade">Cidade:</label>
    <input type="text" id="cidade" th:field="*{endereco.cidade}" />

    <label for="estado">Estado:</label>
    <input type="text" id="estado" th:field="*{endereco.estado}" />

    <label for="cep">CEP:</label>
    <input type="text" id="cep" th:field="*{endereco.cep}" />

    <button type="submit">Cadastrar</button>
  </form>
  <div th:if="${param.sucesso}">
    <p style="color: green;">Cliente cadastrado com sucesso!</p>
  </div>
</body>
</html>
